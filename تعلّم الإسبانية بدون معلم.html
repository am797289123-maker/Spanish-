<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2a2118;--mu:#7a6a58;--ac:#c2410c;--ac2:#fde6d6;--bd:#eadfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--card:#262019;--tx:#f3ebe0;--mu:#b3a493;--ac:#fb923c;--ac2:#3a2a1e;--bd:#3a3128;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1613;--card:#262019;--tx:#f3ebe0;--mu:#b3a493;--ac:#fb923c;--ac2:#3a2a1e;--bd:#3a3128;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:720px;margin-inline:auto}
header{padding:18px 16px 6px;text-align:center}
h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--mu);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:4px 16px;font-size:13px;color:var(--mu)}
.bar button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:3px 12px;font:inherit;cursor:pointer}
.bar button.on{background:var(--ac2);border-color:var(--ac)}
main{padding:6px 12px 40px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer;width:100%;text-align:start;color:var(--tx);font:inherit}
.row:active,.row.pl{background:var(--ac2);border-color:var(--ac)}
.sp{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:15px}
.es{direction:ltr;text-align:left;font-size:19px;font-weight:600;unicode-bidi:isolate}
.ar{color:var(--mu);font-size:15px}
.t{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:17px;color:var(--ac)}
.card p{margin:0 0 8px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ac);background:var(--ac2);color:var(--tx);border-radius:12px;padding:3px 10px;font:inherit;font-size:14px;cursor:pointer;text-align:center}
.chip b{direction:ltr;unicode-bidi:isolate;display:inline-block}
.chip small{color:var(--mu);margin-inline-start:6px}
.warn{background:var(--ac2);border-radius:10px;padding:8px 12px;font-size:13px;margin:6px 0;display:none}
</style>
</head>

 try{speechSynthesis.cancel();

 speechSynthesis.speak(u)}catch(e){warn.style.display="block"}
